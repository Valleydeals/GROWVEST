
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GrowVest Admin Login</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: Arial, sans-serif;
}

body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #f1f5f3;
    padding: 20px;
}

.card {
    width: 100%;
    max-width: 420px;
    background: white;
    padding: 30px;
    border-radius: 18px;
    box-shadow: 0 10px 35px rgba(0,0,0,0.08);
}

.logo {
    text-align: center;
    font-size: 27px;
    font-weight: bold;
    color: #064e3b;
    margin-bottom: 10px;
}

.logo span {
    color: #059669;
}

.subtitle {
    text-align: center;
    color: #64748b;
    margin-bottom: 30px;
}

h1 {
    font-size: 24px;
    color: #17251d;
    margin-bottom: 20px;
}

label {
    display: block;
    font-weight: bold;
    margin-bottom: 8px;
}

input {
    width: 100%;
    padding: 14px;
    border: 1px solid #d1d5db;
    border-radius: 9px;
    margin-bottom: 18px;
    font-size: 16px;
}

button {
    width: 100%;
    padding: 15px;
    background: #047857;
    color: white;
    border: none;
    border-radius: 9px;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
}

button:disabled {
    opacity: 0.6;
}

.message {
    display: none;
    padding: 12px;
    border-radius: 8px;
    margin-bottom: 18px;
    line-height: 1.5;
}

.error {
    background: #fee2e2;
    color: #991b1b;
}

.success {
    background: #dcfce7;
    color: #166534;
}

.back {
    display: block;
    text-align: center;
    margin-top: 20px;
    color: #047857;
    text-decoration: none;
}
</style>
</head>

<body>

<div class="card">

    <div class="logo">GROW<span>VEST</span></div>

    <p class="subtitle">Administration Portal</p>

    <h1>Admin Login</h1>

    <div id="message" class="message"></div>

    <form id="adminLoginForm">

        <label for="username">Admin Username</label>

        <input
            type="text"
            id="username"
            autocomplete="username"
            required
        >

        <label for="password">Admin Password</label>

        <input
            type="password"
            id="password"
            autocomplete="current-password"
            required
        >

        <button id="loginBtn" type="submit">
            Login to Admin Panel
        </button>

    </form>

    <a class="back" href="index.html">
        Back to GrowVest
    </a>

</div>

<script>

const form = document.getElementById("adminLoginForm");
const button = document.getElementById("loginBtn");
const message = document.getElementById("message");

function showMessage(text, type) {
    message.textContent = text;
    message.className = "message " + type;
    message.style.display = "block";
}

form.addEventListener("submit", async function(e) {

    e.preventDefault();

    button.disabled = true;
    button.textContent = "Logging in...";

    try {

        const response = await fetch(
            "/.netlify/functions/admin-login",
            {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    username: document.getElementById("username").value,
                    password: document.getElementById("password").value
                })
            }
        );

        const data = await response.json();

        if (!response.ok) {
            throw new Error(
                data.message || "Admin login failed."
            );
        }

        localStorage.setItem(
            "growvest_admin_token",
            data.token
        );

        showMessage(
            "Login successful. Redirecting...",
            "success"
        );

        window.location.href = "admin.html";

    } catch (error) {

        showMessage(
            error.message || "Unable to login.",
            "error"
        );

    } finally {

        button.disabled = false;
        button.textContent = "Login to Admin Panel";

    }

});

</script>

</body>
</html>
