
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Investments | GROWVEST</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    background: #f4f7f6;
    color: #172b25;
}

header {
    background: #064e3b;
    color: white;
    padding: 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
}

.logo {
    font-size: 25px;
    font-weight: bold;
}

.logo span {
    color: #a7f3d0;
}

.back-btn {
    background: white;
    color: #064e3b;
    border: none;
    padding: 10px 15px;
    border-radius: 8px;
    font-weight: bold;
    cursor: pointer;
}

.container {
    max-width: 1000px;
    margin: auto;
    padding: 25px 16px;
}

h1 {
    margin-bottom: 8px;
}

.subtitle {
    color: #64748b;
    margin-bottom: 25px;
}

.summary {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 14px;
    margin-bottom: 25px;
}

.card {
    background: white;
    padding: 20px;
    border-radius: 14px;
    box-shadow: 0 3px 12px rgba(0,0,0,0.04);
}

.card p {
    color: #64748b;
    font-size: 13px;
    margin-bottom: 10px;
}

.card h2 {
    color: #047857;
    font-size: 23px;
}

.section {
    background: white;
    border-radius: 14px;
    padding: 20px;
    margin-bottom: 20px;
}

.section h2 {
    margin-bottom: 18px;
    font-size: 19px;
}

.investment {
    border: 1px solid #e5eeea;
    border-radius: 12px;
    padding: 18px;
    margin-bottom: 15px;
}

.investment:last-child {
    margin-bottom: 0;
}

.investment-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    margin-bottom: 15px;
}

.plan-name {
    font-size: 17px;
    font-weight: bold;
}

.status {
    padding: 6px 10px;
    border-radius: 20px;
    font-size: 12px;
    font-weight: bold;
    text-transform: capitalize;
}

.active {
    background: #dcfce7;
    color: #166534;
}

.completed {
    background: #dbeafe;
    color: #1d4ed8;
}

.cancelled {
    background: #fee2e2;
    color: #991b1b;
}

.investment-amount {
    font-size: 24px;
    font-weight: bold;
    color: #064e3b;
    margin-bottom: 18px;
}

.details {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 15px;
}

.detail p {
    color: #64748b;
    font-size: 12px;
    margin-bottom: 5px;
}

.detail strong {
    font-size: 14px;
}

.loading,
.empty,
.error {
    text-align: center;
    padding: 35px 15px;
    color: #64748b;
}

.error {
    color: #dc2626;
}

.refresh-btn {
    background: #047857;
    color: white;
    padding: 11px 17px;
    border: none;
    border-radius: 8px;
    margin-top: 12px;
    cursor: pointer;
    font-weight: bold;
}

@media(max-width: 600px) {
    .summary {
        grid-template-columns: 1fr;
    }

    .card h2 {
        font-size: 21px;
    }

    .details {
        gap: 12px;
    }

    .investment {
        padding: 15px;
    }
}
</style>
</head>

<body>

<header>
    <div class="logo">GROW<span>VEST</span></div>

    <button class="back-btn"
        onclick="location.href='dashboard.html'">
        ← Dashboard
    </button>
</header>

<div class="container">

    <h1>My Investments</h1>
    <p class="subtitle">
        View and track your investment records.
    </p>

    <div class="summary">

        <div class="card">
            <p>Total Invested</p>
            <h2 id="totalInvested">KSh 0.00</h2>
        </div>

        <div class="card">
            <p>Active Investments</p>
            <h2 id="activeCount">0</h2>
        </div>

        <div class="card">
            <p>Completed Investments</p>
            <h2 id="completedCount">0</h2>
        </div>

    </div>

    <div class="section">

        <h2>Investment History</h2>

        <div id="investmentsList">
            <div class="loading">
                Loading investments...
            </div>
        </div>

    </div>

</div>

<script>

const token =
    localStorage.getItem("growvest_token") ||
    localStorage.getItem("token") ||
    localStorage.getItem("authToken");

function formatMoney(amount) {
    return "KSh " + Number(amount || 0).toLocaleString("en-KE", {
        minimumFractionDigits: 2,
        maximumFractionDigits: 2
    });
}

function formatDate(date) {
    if (!date) return "N/A";

    return new Date(date).toLocaleDateString("en-KE", {
        day: "numeric",
        month: "short",
        year: "numeric"
    });
}

function getStatusClass(status) {
    return String(status || "").toLowerCase();
}

function renderInvestments(investments) {

    const container = document.getElementById("investmentsList");

    if (!investments || investments.length === 0) {

        container.innerHTML = `
            <div class="empty">
                <h3>No investments yet</h3>
                <p>Your investments will appear here.</p>

                <button class="refresh-btn"
                    onclick="location.href='invest.html'">
                    Explore Investment Plans
                </button>
            </div>
        `;

        return;
    }

    container.innerHTML = investments.map(inv => {

        return `
            <div class="investment">

                <div class="investment-top">

                    <div class="plan-name">
                        ${inv.plan_name || "Investment Plan"}
                    </div>

                    <span class="status ${getStatusClass(inv.status)}">
                        ${inv.status || "Unknown"}
                    </span>

                </div>

                <div class="investment-amount">
                    ${formatMoney(inv.amount)}
                </div>

                <div class="details">

                    <div class="detail">
                        <p>Start Date</p>
                        <strong>${formatDate(inv.start_date)}</strong>
                    </div>

                    <div class="detail">
                        <p>Maturity Date</p>
                        <strong>${formatDate(inv.end_date)}</strong>
                    </div>

                    <div class="detail">
                        <p>Daily Rate</p>
                        <strong>${Number(inv.daily_rate || 0)}%</strong>
                    </div>

                    <div class="detail">
                        <p>Duration</p>
                        <strong>${inv.duration_days || "N/A"} days</strong>
                    </div>

                </div>

            </div>
        `;

    }).join("");
}

async function loadInvestments() {

    const container = document.getElementById("investmentsList");

    if (!token) {

        container.innerHTML = `
            <div class="error">
                Your session has expired.

                <br><br>

                <button class="refresh-btn"
                    onclick="location.href='login.html'">
                    Login Again
                </button>
            </div>
        `;

        return;
    }

    try {

        const response = await fetch(
            "/.netlify/functions/my-investments",
            {
                headers: {
                    "Authorization": "Bearer " + token
                }
            }
        );

        const data = await response.json();

        if (!response.ok) {
            throw new Error(
                data.message || "Unable to load investments"
            );
        }

        const investments = data.investments || [];

        const totalInvested = investments.reduce(
            (sum, inv) => sum + Number(inv.amount || 0),
            0
        );

        const activeInvestments = investments.filter(
            inv => inv.status === "active"
        );

        const completedInvestments = investments.filter(
            inv => inv.status === "completed"
        );

        document.getElementById("totalInvested").textContent =
            formatMoney(totalInvested);

        document.getElementById("activeCount").textContent =
            activeInvestments.length;

        document.getElementById("completedCount").textContent =
            completedInvestments.length;

        renderInvestments(investments);

    } catch (error) {

        container.innerHTML = `
            <div class="error">
                ${error.message}

                <br><br>

                <button class="refresh-btn"
                    onclick="loadInvestments()">
                    Try Again
                </button>
            </div>
        `;
    }
}

loadInvestments();

</script>

</body>
</html>
